name: sign_language_translator
description: Mobile application foundation for a Sign Language Translator.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  dio: ^5.7.0
  flutter_animate: ^4.5.0
  flutter_riverpod: ^2.5.1
  flutter_screenutil: ^5.9.3
  go_router: ^14.2.7
  google_fonts: ^6.2.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
    - assets/config/
